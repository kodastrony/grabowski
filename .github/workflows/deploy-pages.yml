# Deploy statycznej strony na GitHub Pages przez GitHub Actions (Node 24).
# Zastępuje stary tryb "deploy from a branch" (legacy), który nie pozwalał
# kontrolować wersji Node. Aktualne akcje (checkout@v4, configure-pages@v5,
# upload-pages-artifact@v3, deploy-pages@v4) działają na runtime Node 24.
name: Deploy na GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Uprawnienia wymagane do publikacji na Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Jeden deploy naraz; nie przerywaj trwającej publikacji
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Pinujemy toolchain na Node 24 (jawnie, zgodnie z migracją z Node 20).
      # Strona jest statyczna i nie wymaga builda, ale to dokumentuje wersję
      # i jest gotowe pod ewentualny przyszły krok build.
      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Konfiguracja Pages
        uses: actions/configure-pages@v5

      - name: Upload artefaktu (cała strona — bez kroku build)
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy na Pages
        id: deployment
        uses: actions/deploy-pages@v4
